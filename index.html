<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Yeeps-Inspired VR Sandbox</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #0ff;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 15, 30, 0.85);
            padding: 20px;
            border: 2px solid #0ff;
            border-radius: 12px;
            box-shadow: 0 0 15px #0ff, inset 0 0 10px #0ff;
            backdrop-filter: blur(5px);
            width: 300px;
            pointer-events: auto;
        }
        h2 {
            margin: 0 0 15px 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 5px #0ff;
        }
        .status { margin-bottom: 15px; font-size: 0.9rem; word-break: break-all; }
        .peer-id { font-weight: bold; color: #f0f; text-shadow: 0 0 5px #f0f; font-size: 1.1rem; }
        
        input[type="text"] {
            width: calc(100% - 22px);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: 1px solid #0ff;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            outline: none;
        }
        input[type="text"]:focus { box-shadow: 0 0 8px #0ff; }
        
        button {
            width: 100%;
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 10px;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 10px #0ff;
        }
        
        #controls-info {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 15px;
            line-height: 1.4;
            border-top: 1px solid rgba(0, 255, 255, 0.3);
            padding-top: 10px;
        }
        .highlight { color: #0ff; }

        /* Crosshair for desktop */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: transparent;
            border: 2px solid #0ff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            display: none;
        }
    </style>
    <!-- PeerJS for WebRTC Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <!-- Import Maps for Three.js and Cannon-es -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>
    <div id="ui-layer">
        <h2>VR Sandbox</h2>
        <div class="status">Your ID: <br><span id="my-id" class="peer-id">Connecting...</span></div>
        <div class="status">Status: <span id="conn-status" style="color:#ff0">Offline</span></div>
        
        <input type="text" id="friend-id" placeholder="Enter Host ID to Join">
        <button id="join-btn">Join Lobby</button>
        <button id="desktop-play-btn">Play (Desktop)</button>
        
        <div id="controls-info">
            <strong>Desktop:</strong> WASD to move, Space to Jump. Click to lock mouse. Left Click to Spawn Box, Right Click to Grab.<br><br>
            <strong>VR:</strong> Left Stick to Move/Jump. Right Stick to Turn. Right Trigger to Spawn. Grip to Grab.
        </div>
    </div>
    <div id="crosshair"></div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import * as CANNON from 'cannon-es';

        // ==========================================
        // 1. ENGINE & GRAPHICS SETUP
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 10, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // VR Locomotion Group
        const userGroup = new THREE.Group();
        userGroup.position.set(0, 1.6, 0); // Start position
        scene.add(userGroup);
        userGroup.add(camera);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x4444ff, 0.4);
        scene.add(hemiLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 50, 20);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Grid/Environment
        const gridHelper = new THREE.GridHelper(200, 100, 0x00ffff, 0x003333);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // ==========================================
        // 2. PHYSICS SETUP (CANNON-ES)
        // ==========================================
        const world = new CANNON.World({
            gravity: new CANNON.Vec3(0, -15, 0), // Snappy gravity
        });
        world.broadphase = new CANNON.SAPBroadphase(world);
        world.solver.iterations = 10;

        // Physics Materials
        const physicsMaterial = new CANNON.Material("standard");
        const physicsContactMaterial = new CANNON.ContactMaterial(physicsMaterial, physicsMaterial, {
            friction: 0.1,
            restitution: 0.2
        });
        world.addContactMaterial(physicsContactMaterial);

        // Ground Physics
        const groundBody = new CANNON.Body({
            type: CANNON.Body.STATIC,
            shape: new CANNON.Plane(),
            material: physicsMaterial
        });
        groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(groundBody);

        // Visual Ground
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x111111, 
            roughness: 0.8,
            metalness: 0.2
        });
        const groundMesh = new THREE.Mesh(groundGeo, groundMat);
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        // Player Physics Body (Capsule/Sphere for movement)
        const playerRadius = 0.4;
        const playerBody = new CANNON.Body({
            mass: 50,
            shape: new CANNON.Sphere(playerRadius),
            position: new CANNON.Vec3(0, 5, 0),
            material: physicsMaterial,
            linearDamping: 0.9,
            fixedRotation: true
        });
        world.addBody(playerBody);

        // Static Level Geometry (Parkour elements)
        function createStaticPlatform(x, y, z, w, h, d, color) {
            const body = new CANNON.Body({
                type: CANNON.Body.STATIC,
                shape: new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)),
                position: new CANNON.Vec3(x, y, z),
                material: physicsMaterial
            });
            world.addBody(body);
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 })
            );
            mesh.position.copy(body.position);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
        }
        
        // Spawn some parkour platforms
        createStaticPlatform(0, 2, -10, 4, 1, 4, 0xff0055);
        createStaticPlatform(5, 4, -15, 3, 1, 3, 0x00ffaa);
        createStaticPlatform(10, 6, -10, 3, 1, 3, 0xffff00);
        createStaticPlatform(15, 8, -5, 2, 1, 2, 0xff00ff);

        // Sandbox Objects Management
        const networkObjects = {}; // id -> {mesh, body}
        
        function spawnPhysicalBox(id, x, y, z, color, isLocal = false) {
            if (networkObjects[id]) return; // Already exists

            const size = 0.6;
            const body = new CANNON.Body({
                mass: 2,
                shape: new CANNON.Box(new CANNON.Vec3(size/2, size/2, size/2)),
                position: new CANNON.Vec3(x, y, z),
                material: physicsMaterial
            });
            
            // Only host simulates full physics, clients sync transforms to avoid desync
            // But for this P2P demo, everyone simulates to keep it responsive, host acts as authority
            world.addBody(body);

            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(size, size, size),
                new THREE.MeshStandardMaterial({ 
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.2,
                    roughness: 0.4
                })
            );
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            networkObjects[id] = { body, mesh, owner: isLocal ? myPeerId : null };
            
            if (isLocal) {
                broadcast({ type: 'SPAWN', id, pos: [x,y,z], color });
            }
        }

        // ==========================================
        // 3. VR CONTROLLERS & DESKTOP CONTROLS
        // ==========================================
        let isDesktop = false;
        const desktopControls = new PointerLockControls(camera, document.body);
        
        document.getElementById('desktop-play-btn').addEventListener('click', () => {
            isDesktop = true;
            desktopControls.lock();
            document.getElementById('ui-layer').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
        });

        desktopControls.addEventListener('unlock', () => {
            document.getElementById('ui-layer').style.display = 'block';
            document.getElementById('crosshair').style.display = 'none';
        });

        // Desktop Input state
        const keys = { w: false, a: false, s: false, d: false, space: false };
        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW') keys.w = true;
            if(e.code === 'KeyA') keys.a = true;
            if(e.code === 'KeyS') keys.s = true;
            if(e.code === 'KeyD') keys.d = true;
            if(e.code === 'Space') {
                if(playerBody.position.y < playerRadius + 0.5) {
                    playerBody.velocity.y = 8; // Jump
                }
            }
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW') keys.w = false;
            if(e.code === 'KeyA') keys.a = false;
            if(e.code === 'KeyS') keys.s = false;
            if(e.code === 'KeyD') keys.d = false;
        });

        // VR Controllers
        const controller1 = renderer.xr.getController(0); // Right Hand
        const controller2 = renderer.xr.getController(1); // Left Hand
        userGroup.add(controller1);
        userGroup.add(controller2);

        // Controller Models
        const handGeo = new THREE.BoxGeometry(0.08, 0.08, 0.15);
        const handMat1 = new THREE.MeshStandardMaterial({ color: 0x00ffff, wireframe: true });
        const handMat2 = new THREE.MeshStandardMaterial({ color: 0xff00ff, wireframe: true });
        const rightHandMesh = new THREE.Mesh(handGeo, handMat1);
        const leftHandMesh = new THREE.Mesh(handGeo, handMat2);
        controller1.add(rightHandMesh);
        controller2.add(leftHandMesh);

        // VR Locomotion State
        let vrVelocity = new THREE.Vector3();
        let vrDirection = new THREE.Vector3();

        // Grabbing System
        let grabbedObject = null;
        let grabConstraint = null;
        let grabHand = null;
        let previousHandPos = new THREE.Vector3();
        let handVelocity = new THREE.Vector3();

        function handleGrabStart(controller) {
            // Find nearest object
            let nearestDist = 0.5; // Grab range
            let nearestObj = null;
            let nearestId = null;
            
            const ctrlWorldPos = new THREE.Vector3();
            controller.getWorldPosition(ctrlWorldPos);

            for (let id in networkObjects) {
                const obj = networkObjects[id];
                const dist = obj.mesh.position.distanceTo(ctrlWorldPos);
                if (dist < nearestDist) {
                    nearestDist = dist;
                    nearestObj = obj;
                    nearestId = id;
                }
            }

            if (nearestObj) {
                grabbedObject = nearestObj;
                grabHand = controller;
                
                // Set Ownership
                grabbedObject.owner = myPeerId;
                broadcast({ type: 'OWN', objId: nearestId, owner: myPeerId });

                // Attach visually and disable physics temporarily
                world.removeBody(grabbedObject.body);
            }
        }

        function handleGrabEnd() {
            if (grabbedObject) {
                // Re-enable physics
                world.addBody(grabbedObject.body);
                grabbedObject.body.position.copy(grabbedObject.mesh.position);
                grabbedObject.body.quaternion.copy(grabbedObject.mesh.quaternion);
                
                // Apply throwing velocity
                grabbedObject.body.velocity.set(handVelocity.x * 30, handVelocity.y * 30, handVelocity.z * 30);
                
                grabbedObject = null;
                grabHand = null;
            }
        }

        // Controller Events (VR)
        controller1.addEventListener('squeezestart', () => handleGrabStart(controller1)); // Right Grip
        controller1.addEventListener('squeezeend', handleGrabEnd);
        
        // Spawn Object
        controller1.addEventListener('selectstart', () => { // Right Trigger
            const pos = new THREE.Vector3();
            controller1.getWorldPosition(pos);
            const dir = new THREE.Vector3(0, 0, -1);
            dir.applyQuaternion(controller1.quaternion);
            
            const spawnPos = pos.clone().add(dir.multiplyScalar(1.0)); // Spawn 1m in front
            const objId = 'obj_' + Math.random().toString(36).substr(2, 9);
            const color = Math.random() * 0xffffff;
            spawnPhysicalBox(objId, spawnPos.x, spawnPos.y, spawnPos.z, color, true);
        });

        // Desktop Events
        document.addEventListener('mousedown', (e) => {
            if(!isDesktop || !desktopControls.isLocked) return;
            
            if (e.button === 0) { // Left Click - Spawn
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                const pos = camera.position.clone().add(dir.multiplyScalar(2));
                const objId = 'obj_' + Math.random().toString(36).substr(2, 9);
                const color = Math.random() * 0xffffff;
                spawnPhysicalBox(objId, pos.x, pos.y, pos.z, color, true);
            }
            if (e.button === 2) { // Right click - simple throw forward of nearest obj
                 let nearestDist = 3.0; 
                 let nearestObj = null;
                 for (let id in networkObjects) {
                     const obj = networkObjects[id];
                     const dist = obj.mesh.position.distanceTo(camera.position);
                     if (dist < nearestDist) { nearestDist = dist; nearestObj = obj; }
                 }
                 if(nearestObj) {
                     const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                     nearestObj.body.position.copy(camera.position).add(dir.multiplyScalar(1));
                     nearestObj.body.velocity.copy(dir.multiplyScalar(15));
                 }
            }
        });

        // ==========================================
        // 4. MULTIPLAYER (PEERJS)
        // ==========================================
        const peer = new Peer(null, { debug: 2 });
        let myPeerId = null;
        let isHost = false;
        let hostConnection = null;
        const connections = {}; // For host: connected clients
        const remotePlayers = {}; // id -> Group

        const uiMyId = document.getElementById('my-id');
        const uiStatus = document.getElementById('conn-status');

        peer.on('open', (id) => {
            myPeerId = id;
            uiMyId.innerText = id;
            isHost = true; // Default to host unless we join someone
            uiStatus.innerText = "Ready (Host)";
            uiStatus.style.color = "#0f0";
        });

        // When someone joins US (We are host)
        peer.on('connection', (conn) => {
            setupConnection(conn);
            conn.on('open', () => {
                // Send current state to new player
                const state = { type: 'FULL_STATE', objects: [] };
                for (let id in networkObjects) {
                    const obj = networkObjects[id];
                    state.objects.push({
                        id, pos: obj.body.position.toArray(), 
                        color: obj.mesh.material.color.getHex()
                    });
                }
                conn.send(state);
            });
        });

        // Join Button Logic (We become client)
        document.getElementById('join-btn').addEventListener('click', () => {
            const hostId = document.getElementById('friend-id').value.trim();
            if (hostId && hostId !== myPeerId) {
                isHost = false;
                uiStatus.innerText = "Connecting...";
                uiStatus.style.color = "#ff0";
                
                const conn = peer.connect(hostId);
                hostConnection = conn;
                setupConnection(conn);
            }
        });

        function setupConnection(conn) {
            connections[conn.peer] = conn;
            createRemotePlayer(conn.peer);

            conn.on('open', () => {
                uiStatus.innerText = isHost ? `Hosting (${Object.keys(connections).length} connected)` : "Connected to Host";
                uiStatus.style.color = "#0f0";
            });

            conn.on('data', (data) => {
                handleNetworkData(data, conn.peer);
                // If Host, relay to other clients
                if (isHost && data.type !== 'FULL_STATE') {
                    for (let id in connections) {
                        if (id !== conn.peer && connections[id].open) {
                            connections[id].send(data);
                        }
                    }
                }
            });

            conn.on('close', () => {
                removeRemotePlayer(conn.peer);
                delete connections[conn.peer];
                if(isHost) uiStatus.innerText = `Hosting (${Object.keys(connections).length} connected)`;
            });
        }

        function createRemotePlayer(id) {
            const group = new THREE.Group();
            
            // Stylized Head
            const headMesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.35, 0.35, 0.35), 
                new THREE.MeshStandardMaterial({color: 0x00ffff, emissive: 0x004444})
            );
            // Visor
            const visor = new THREE.Mesh(
                new THREE.BoxGeometry(0.4, 0.1, 0.1),
                new THREE.MeshBasicMaterial({color: 0xffffff})
            );
            visor.position.set(0, 0, -0.18);
            headMesh.add(visor);

            // Hands
            const lHand = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.15), new THREE.MeshStandardMaterial({color: 0xff00ff}));
            const rHand = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.15), new THREE.MeshStandardMaterial({color: 0x00ffff}));

            group.add(headMesh);
            group.add(lHand);
            group.add(rHand);
            scene.add(group);

            remotePlayers[id] = { group, head: headMesh, lHand, rHand };
        }

        function removeRemotePlayer(id) {
            if (remotePlayers[id]) {
                scene.remove(remotePlayers[id].group);
                delete remotePlayers[id];
            }
        }

        function broadcast(data) {
            if (isHost) {
                // Send to all clients
                for (let id in connections) {
                    if (connections[id].open) connections[id].send(data);
                }
            } else if (hostConnection && hostConnection.open) {
                // Send to host (who relays)
                hostConnection.send(data);
            }
        }

        function handleNetworkData(data, senderId) {
            switch(data.type) {
                case 'PLAYER_SYNC':
                    if (remotePlayers[senderId]) {
                        const rp = remotePlayers[senderId];
                        rp.head.position.fromArray(data.hP);
                        rp.head.quaternion.fromArray(data.hQ);
                        rp.lHand.position.fromArray(data.lP);
                        rp.lHand.quaternion.fromArray(data.lQ);
                        rp.rHand.position.fromArray(data.rP);
                        rp.rHand.quaternion.fromArray(data.rQ);
                    }
                    break;
                case 'SPAWN':
                    spawnPhysicalBox(data.id, data.pos[0], data.pos[1], data.pos[2], data.color, false);
                    break;
                case 'OBJ_SYNC':
                    if (networkObjects[data.id] && networkObjects[data.id].owner !== myPeerId) {
                        const obj = networkObjects[data.id];
                        obj.body.position.fromArray(data.p);
                        obj.body.quaternion.fromArray(data.q);
                        obj.body.velocity.fromArray(data.v);
                    }
                    break;
                case 'OWN':
                    if (networkObjects[data.objId]) {
                        networkObjects[data.objId].owner = data.owner;
                    }
                    break;
                case 'FULL_STATE':
                    // Initial load for clients
                    data.objects.forEach(obj => {
                        spawnPhysicalBox(obj.id, obj.pos[0], obj.pos[1], obj.pos[2], obj.color, false);
                    });
                    break;
            }
        }

        // ==========================================
        // 5. MAIN LOOP
        // ==========================================
        const clock = new THREE.Clock();
        let networkTick = 0;

        renderer.setAnimationLoop(() => {
            const dt = clock.getDelta();

            // 1. Desktop Locomotion logic
            if (isDesktop && desktopControls.isLocked) {
                const speed = 10;
                vrDirection.set(Number(keys.d) - Number(keys.a), 0, Number(keys.s) - Number(keys.w));
                vrDirection.normalize();
                
                // Apply rotation from camera
                const euler = new THREE.Euler(0, camera.rotation.y, 0, 'YXZ');
                vrDirection.applyEuler(euler);

                playerBody.velocity.x = vrDirection.x * speed;
                playerBody.velocity.z = vrDirection.z * speed;
                
                // Map camera to physics body
                camera.position.copy(playerBody.position);
                camera.position.y += 0.8; // Eye height offset from sphere center
            } 
            // 2. VR Locomotion Logic
            else if (renderer.xr.isPresenting) {
                const session = renderer.xr.getSession();
                if (session && session.inputSources) {
                    for (const source of session.inputSources) {
                        if (!source.gamepad) continue;
                        const axes = source.gamepad.axes;
                        
                        // Left Controller - Movement (Axes 2, 3)
                        if (source.handedness === 'left') {
                            const x = axes[2];
                            const y = axes[3];
                            if (Math.abs(x) > 0.1 || Math.abs(y) > 0.1) {
                                const speed = 6;
                                const dir = new THREE.Vector3(x, 0, y);
                                // Move relative to head rotation
                                const headRot = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
                                dir.applyEuler(new THREE.Euler(0, headRot.y, 0));
                                
                                playerBody.velocity.x = dir.x * speed;
                                playerBody.velocity.z = dir.z * speed;
                            }
                            
                            // Jump (A/X Button - usually button 4 or 5, checking 4 for generic XR)
                            if (source.gamepad.buttons[4]?.pressed || source.gamepad.buttons[0]?.pressed) {
                                if(playerBody.position.y < playerRadius + 0.5 && playerBody.velocity.y < 1) {
                                    playerBody.velocity.y = 8;
                                }
                            }
                        }
                        // Right Controller - Snap Turn (Axes 2, 3)
                        if (source.handedness === 'right') {
                            // Implement snap turning here if desired, simplified for MVP
                        }
                    }
                }

                // Sync VR Rig to Physics Body
                userGroup.position.copy(playerBody.position);
                userGroup.position.y -= playerRadius; // Offset so rig stands on ground
            }

            // Step Physics
            world.step(1/60, dt, 3);

            // Handle Grabbed Object Physics Override & Throw Velocity
            if (grabbedObject && grabHand) {
                const handWorldPos = new THREE.Vector3();
                const handWorldQuat = new THREE.Quaternion();
                grabHand.getWorldPosition(handWorldPos);
                grabHand.getWorldQuaternion(handWorldQuat);

                grabbedObject.mesh.position.copy(handWorldPos);
                grabbedObject.mesh.quaternion.copy(handWorldQuat);
                
                // Calculate manual velocity for throwing
                handVelocity.subVectors(handWorldPos, previousHandPos).divideScalar(dt);
                previousHandPos.copy(handWorldPos);
            }

            // Sync Objects (Physics -> Graphics)
            for (let id in networkObjects) {
                const obj = networkObjects[id];
                if (obj !== grabbedObject) {
                    obj.mesh.position.copy(obj.body.position);
                    obj.mesh.quaternion.copy(obj.body.quaternion);
                }
            }

            // Network Broadcasting (Rate limited ~20Hz)
            networkTick += dt;
            if (networkTick > 0.05) {
                networkTick = 0;

                // Sync Local Player Avatar
                if (myPeerId) {
                    const hP = new THREE.Vector3(); const hQ = new THREE.Quaternion();
                    const lP = new THREE.Vector3(); const lQ = new THREE.Quaternion();
                    const rP = new THREE.Vector3(); const rQ = new THREE.Quaternion();

                    camera.getWorldPosition(hP); camera.getWorldQuaternion(hQ);
                    controller2.getWorldPosition(lP); controller2.getWorldQuaternion(lQ);
                    controller1.getWorldPosition(rP); controller1.getWorldQuaternion(rQ);

                    broadcast({
                        type: 'PLAYER_SYNC',
                        hP: hP.toArray(), hQ: hQ.toArray(),
                        lP: lP.toArray(), lQ: lQ.toArray(),
                        rP: rP.toArray(), rQ: rQ.toArray()
                    });
                }

                // Sync owned objects
                for (let id in networkObjects) {
                    const obj = networkObjects[id];
                    // Host syncs everything unowned, clients sync what they own (grabbed)
                    if (obj.owner === myPeerId || (isHost && obj.owner === null)) {
                        // Sleep check optimization
                        if (obj.body.velocity.lengthSquared() > 0.01 || obj === grabbedObject) {
                            broadcast({
                                type: 'OBJ_SYNC',
                                id: id,
                                p: obj.mesh.position.toArray(),
                                q: obj.mesh.quaternion.toArray(),
                                v: obj.body.velocity.toArray()
                            });
                        }
                    }
                }
            }

            renderer.render(scene, camera);
        });

        // Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Prevent context menu on right click
        document.addEventListener('contextmenu', event => event.preventDefault());

    </script>
</body>
</html>
